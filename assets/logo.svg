<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Shackle / Unlock Gradient -->
    <linearGradient id="unlockGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS Style Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Subtle Inner Grid / Tech Lines -->
  <circle cx="256" cy="256" r="160" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.2"/>
  <circle cx="256" cy="256" r="190" stroke="#818CF8" stroke-width="1" opacity="0.15"/>

  <!-- Unlocked Shackle (Quarantine Broken) -->
  <path d="M 216 190 V 144 C 216 100 252 64 296 64 C 340 64 376 100 376 144 V 162" 
        fill="none" 
        stroke="url(#unlockGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- Shield Base (Safety & Freedom) -->
  <path d="M 140 180 C 140 180 256 160 256 160 C 256 160 372 180 372 180 C 372 290 290 370 256 400 C 222 370 140 290 140 180 Z" 
        fill="#1E293B" 
        fill-opacity="0.85" 
        stroke="url(#primaryGlow)" 
        stroke-width="8" 
        filter="url(#glow)"/>

  <!-- Central Lightning / Fast Action Symbol -->
  <path d="M 270 200 L 225 272 H 265 L 242 344 L 298 262 H 258 Z" 
        fill="url(#primaryGlow)"/>

  <!-- UQ Monogram Typography -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#F8FAFC" 
        opacity="0.95">UQ</text>
</svg>
