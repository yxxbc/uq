<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="uq">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101B2E" />
      <stop offset="1" stop-color="#0A1120" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#021B12" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)" />
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" />

  <g filter="url(#shadow)">
    <!-- open shackle: left leg in, over the top, short right leg stops above the body -->
    <path d="M200 252 V198 a56 56 0 0 1 112 0 v8"
          fill="none" stroke="#E8EEF7" stroke-width="30" stroke-linecap="round" />

    <!-- lock body -->
    <rect x="164" y="240" width="184" height="168" rx="48" fill="url(#body)" />

    <!-- check mark: freed -->
    <path d="M208 326 l36 38 l62 -74"
          fill="none" stroke="#04291D" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
