name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Binaries
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_name: arm64
          - target: x86_64-apple-darwin
            arch_name: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Sync release metadata from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_release_version.py

      - name: Build binary
        run: |
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid tag format: $TAG_NAME"
              exit 1
            fi
          else
            echo "Manual workflow run detected; fallback release name will be used."
          fi

          if [[ ! -f "target/${{ matrix.target }}/release/uq" ]]; then
            echo "Built binary is missing: target/${{ matrix.target }}/release/uq"
            exit 1
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" != v* ]]; then
            TAG_NAME="v0.1.0"
          fi

          ARCHIVE_NAME="uq-${TAG_NAME}-macos-${{ matrix.arch_name }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" uq
          shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Generate release notes from changelog
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" != v* ]]; then
            TAG_NAME="v0.1.0"
          fi

          if [[ ! -f CHANGELOG.md ]]; then
            cat > RELEASE_NOTES.md <<EOF
          ## ${TAG_NAME}

          Automated release generated by GitHub Actions.
          EOF
            exit 0
          fi

          python3 - "$TAG_NAME" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          sections = re.split(r'(?m)^## ', text)
          target = None
          for part in sections[1:]:
              if part.startswith(f'[{tag}]') or part.startswith(f'{tag}'):
                  target = part
                  break
          if target is None:
              target = sections[-1] if sections else ''
          body = '## ' + target.strip()
          Path('RELEASE_NOTES.md').write_text(body + '\n', encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uq-macos-${{ matrix.arch_name }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
            RELEASE_NOTES.md

  publish:
    name: Publish to Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release note body
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f release-assets/RELEASE_NOTES.md ]]; then
            cp release-assets/RELEASE_NOTES.md RELEASE_NOTES.md
          elif find release-assets -name RELEASE_NOTES.md | head -n 1 >/dev/null 2>&1; then
            cp "$(find release-assets -name RELEASE_NOTES.md | head -n 1)" RELEASE_NOTES.md
          else
            echo "## Release" > RELEASE_NOTES.md
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
