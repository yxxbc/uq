name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Binaries
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_name: arm64
          - target: x86_64-apple-darwin
            arch_name: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Sync release metadata from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_release_version.py

      - name: Build binary
        run: |
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid tag format: $TAG_NAME"
              exit 1
            fi
            if [[ "$TAG_NAME" != "v$VERSION" ]]; then
              echo "Tag $TAG_NAME does not match Cargo.toml version $VERSION"
              exit 1
            fi
          else
            echo "Manual workflow run detected for Cargo.toml version $VERSION."
          fi

          if [[ ! -f "target/${{ matrix.target }}/release/uq" ]]; then
            echo "Built binary is missing: target/${{ matrix.target }}/release/uq"
            exit 1
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" != v* ]]; then
            VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
            TAG_NAME="v$VERSION"
          fi

          ARCHIVE_NAME="uq-${TAG_NAME}-macos-${{ matrix.arch_name }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" uq
          shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uq-macos-${{ matrix.arch_name }}
          path: |
            uq-*.tar.gz
            uq-*.tar.gz.sha256

  publish:
    name: Publish to Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release note body
        shell: python
        run: |
          import re
          import sys
          from pathlib import Path

          tag = "${{ github.ref_name }}"
          version = tag[1:] if tag.startswith("v") else tag
          sections = re.split(r"(?m)^## ", Path("CHANGELOG.md").read_text(encoding="utf-8"))
          target = next(
              (
                  section
                  for section in sections[1:]
                  if section.lstrip().startswith((f"[{version}]", f"[{tag}]", version, tag))
              ),
              None,
          )
          if target is None:
              sys.exit(f"No CHANGELOG.md section found for {tag}")
          Path("release-notes.md").write_text("## " + target.strip() + "\n", encoding="utf-8")

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
